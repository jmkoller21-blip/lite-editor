name: build-windows

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-windows
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Fetch FFmpeg (LGPL build)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ffx
          $root = Get-ChildItem ffx -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          Copy-Item "$($root.FullName)\bin\ffmpeg.exe" ffmpeg\
          Copy-Item "$($root.FullName)\bin\ffprobe.exe" ffmpeg\
          Copy-Item "$($root.FullName)\LICENSE.txt" ffmpeg\
          Get-ChildItem ffmpeg | Format-Table Name, Length
          .\ffmpeg\ffmpeg.exe -hide_banner -encoders | Select-String "h264|libvpx|aac"

      - name: Fetch background-removal runtime and model
        shell: pwsh
        run: |
          $v = "1.20.1"
          Invoke-WebRequest -Uri "https://github.com/microsoft/onnxruntime/releases/download/v$v/onnxruntime-win-x64-$v.zip" -OutFile ort.zip
          Expand-Archive ort.zip -DestinationPath ortx
          $root = Get-ChildItem ortx -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force ai | Out-Null
          Copy-Item "$($root.FullName)\lib\onnxruntime.dll" ai\
          Copy-Item "$($root.FullName)\LICENSE" ai\ONNXRUNTIME-LICENSE.txt
          Invoke-WebRequest -Uri "https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx" -OutFile ai\u2netp.onnx
          foreach ($d in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll") { Copy-Item "$env:SystemRoot\System32\$d" ai\ }
          Get-ChildItem ai | Format-Table Name, Length

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine
            src-tauri

      - name: Engine tests
        id: tests
        shell: cmd
        continue-on-error: true
        timeout-minutes: 15
        env:
          LITE_FFMPEG_DIR: ${{ github.workspace }}\ffmpeg
        run: cargo test --manifest-path engine/Cargo.toml --lib --test export_it --test server_it > test-output.txt 2>&1

      - name: Background removal tests
        id: cutouttests
        shell: cmd
        continue-on-error: true
        timeout-minutes: 8
        env:
          LITE_FFMPEG_DIR: ${{ github.workspace }}\ffmpeg
          LITE_AI_DIR: ${{ github.workspace }}\ai
        run: cargo test --manifest-path engine/Cargo.toml --test cutout_it > cutout-output.txt 2>&1

      - name: Build installer
        shell: pwsh
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis

      - name: Show installer
        shell: pwsh
        run: Get-ChildItem src-tauri\target\release\bundle\nsis | Format-Table Name, Length

      - name: Acceptance test (install, run, export, uninstall)
        id: smoke
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 12
        run: ./tools/ci-smoke.ps1

      - name: Write report
        if: always()
        shell: pwsh
        run: |
          $r = @()
          $r += "Engine tests on Windows: ${{ steps.tests.outcome }}"
          if (Test-Path test-output.txt) {
            $r += (Select-String -Path test-output.txt -Pattern 'test result|FAILED|panicked|failed' | Select-Object -Last 30 | ForEach-Object { $_.Line })
          }
          $r += "Background removal tests on Windows: ${{ steps.cutouttests.outcome }}"
          if (Test-Path cutout-output.txt) {
            $r += (Select-String -Path cutout-output.txt -Pattern 'test result|FAILED|panicked|failed|matte|error' | Select-Object -Last 12 | ForEach-Object { $_.Line.Substring(0, [Math]::Min(300, $_.Line.Length)) })
          }
          $r += ''
          if (Test-Path smoke-result.txt) { $r += (Get-Content smoke-result.txt) } else { $r += "No acceptance result was written (smoke step: ${{ steps.smoke.outcome }})." }
          $r | Out-File -FilePath ci-report.txt -Encoding utf8
          Get-Content ci-report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: lite-editor-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Lite Editor build ${{ github.run_number }}
          prerelease: true
          body_path: ci-report.txt
          files: src-tauri/target/release/bundle/nsis/*.exe
