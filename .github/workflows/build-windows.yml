name: build-windows

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-windows
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Fetch FFmpeg (LGPL build)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ffx
          $root = Get-ChildItem ffx -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          Copy-Item "$($root.FullName)\bin\ffmpeg.exe" ffmpeg\
          Copy-Item "$($root.FullName)\bin\ffprobe.exe" ffmpeg\
          Copy-Item "$($root.FullName)\LICENSE.txt" ffmpeg\
          Get-ChildItem ffmpeg | Format-Table Name, Length
          .\ffmpeg\ffmpeg.exe -hide_banner -encoders | Select-String "h264|libvpx|aac"

      - name: Fetch background-removal runtime and model
        shell: pwsh
        run: |
          $v = "1.20.1"
          Invoke-WebRequest -Uri "https://github.com/microsoft/onnxruntime/releases/download/v$v/onnxruntime-win-x64-$v.zip" -OutFile ort.zip
          Expand-Archive ort.zip -DestinationPath ortx
          $root = Get-ChildItem ortx -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force ai | Out-Null
          Copy-Item "$($root.FullName)\lib\onnxruntime.dll" ai\
          Copy-Item "$($root.FullName)\LICENSE" ai\ONNXRUNTIME-LICENSE.txt
          Invoke-WebRequest -Uri "https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx" -OutFile ai\u2netp.onnx
          foreach ($d in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll") { Copy-Item "$env:SystemRoot\System32\$d" ai\ }
          Get-ChildItem ai | Format-Table Name, Length

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine
            src-tauri

      - name: Engine tests
        id: tests
        shell: cmd
        continue-on-error: true
        timeout-minutes: 15
        env:
          LITE_FFMPEG_DIR: ${{ github.workspace }}\ffmpeg
        run: cargo test --manifest-path engine/Cargo.toml --lib --test export_it --test server_it > test-output.txt 2>&1

      - name: Background removal tests
        id: cutouttests
        shell: cmd
        continue-on-error: true
        timeout-minutes: 8
        env:
          LITE_FFMPEG_DIR: ${{ github.workspace }}\ffmpeg
          LITE_AI_DIR: ${{ github.workspace }}\ai
        run: cargo test --manifest-path engine/Cargo.toml --test cutout_it > cutout-output.txt 2>&1

      - name: Build installer
        shell: pwsh
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis

      - name: Show installer
        shell: pwsh
        run: Get-ChildItem src-tauri\target\release\bundle\nsis | Format-Table Name, Length

      - name: Acceptance test (install, run, export, uninstall)
        id: smoke
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 12
        run: ./tools/ci-smoke.ps1

      - name: Write report
        if: always()
        shell: pwsh
        run: |
          $r = @()
          $r += "Engine tests on Windows: ${{ steps.tests.outcome }}"
          if (Test-Path test-output.txt) {
            $r += (Select-String -Path test-output.txt -Pattern 'test result|FAILED' | Select-Object -Last 14 | ForEach-Object { $_.Line })
            $lines = Get-Content test-output.txt
            for ($n = 0; $n -lt $lines.Count; $n++) {
              if ($lines[$n] -match '^---- .* stdout ----') { $r += $lines[$n..([Math]::Min($n + 8, $lines.Count - 1))] | ForEach-Object { '    ' + $_.Substring(0, [Math]::Min(500, $_.Length)) } }
            }
          }
          $r += "Background removal tests on Windows: ${{ steps.cutouttests.outcome }}"
          if (Test-Path cutout-output.txt) {
            $r += (Select-String -Path cutout-output.txt -Pattern 'test result|FAILED|panicked|failed|matte|error' | Select-Object -Last 12 | ForEach-Object { $_.Line.Substring(0, [Math]::Min(300, $_.Line.Length)) })
          }
          $r += ''
          if (Test-Path smoke-result.txt) { $r += (Get-Content smoke-result.txt) } else { $r += "No acceptance result was written (smoke step: ${{ steps.smoke.outcome }})." }
          $r | Out-File -FilePath ci-report.txt -Encoding utf8
          Get-Content ci-report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: lite-editor-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Lite Editor build ${{ github.run_number }}
          prerelease: true
          body_path: ci-report.txt
          files: src-tauri/target/release/bundle/nsis/*.exe

  # Linux installer (.deb and AppImage) for the same build number. Runs after the Windows job
  # so it can attach its files to the release that job created.
  linux:
    needs: windows
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file

      - uses: dtolnay/rust-toolchain@stable

      - name: Fetch FFmpeg (LGPL build) and background-removal runtime and model
        run: |
          mkdir -p ffmpeg ai ff-tmp ort-tmp
          curl -L -o ff-tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-lgpl.tar.xz
          tar -xJf ff-tmp/ff.tar.xz -C ff-tmp
          cp ff-tmp/*/bin/ffmpeg ff-tmp/*/bin/ffprobe ffmpeg/
          cp ff-tmp/*/LICENSE.txt ffmpeg/ 2>/dev/null || true
          curl -L -o ort-tmp/ort.tgz https://github.com/microsoft/onnxruntime/releases/download/v1.20.1/onnxruntime-linux-x64-1.20.1.tgz
          tar -xzf ort-tmp/ort.tgz -C ort-tmp
          cp ort-tmp/onnxruntime-linux-x64-1.20.1/lib/libonnxruntime.so.1.20.1 ai/libonnxruntime.so
          cp ort-tmp/onnxruntime-linux-x64-1.20.1/LICENSE ai/ONNXRUNTIME-LICENSE.txt
          curl -L -o ai/u2netp.onnx https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx
          ffmpeg/ffmpeg -hide_banner -encoders | grep -E "libx264|libvpx|aac" || true
          ls -la ffmpeg ai

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine
            src-tauri

      - name: Engine tests (Linux)
        id: tests
        continue-on-error: true
        timeout-minutes: 15
        env:
          LITE_FFMPEG_DIR: ${{ github.workspace }}/ffmpeg
          LITE_AI_DIR: ${{ github.workspace }}/ai
        run: cargo test --manifest-path engine/Cargo.toml --lib --test export_it --test server_it > test-output.txt 2>&1

      - name: Build Linux installers
        run: npx --yes @tauri-apps/cli@2 build --bundles deb appimage

      - name: Show installers
        run: ls -la src-tauri/target/release/bundle/deb src-tauri/target/release/bundle/appimage

      - name: Write Linux report
        run: |
          {
            echo "Linux build ${{ github.run_number }} (commit ${{ github.sha }})"
            echo "Engine tests on Linux: ${{ steps.tests.outcome }}"
            grep -E 'test result|FAILED|panicked' test-output.txt | tail -20 || true
          } > linux-report.txt
          cat linux-report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: lite-editor-linux-installers
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Lite Editor build ${{ github.run_number }}
          prerelease: true
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
